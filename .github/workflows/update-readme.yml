name: Update README Program List

on:
  push:
    branches:
      - main
    paths:
      - '**.c'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update C program list
        run: |
          python - <<'PY'
          from pathlib import Path

          programs = sorted(
              p.name for p in Path(".").rglob("*.c")
              if ".git" not in p.parts
          )

          start = "<!-- PROGRAMS:START -->"
          end = "<!-- PROGRAMS:END -->"

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")

          program_list = "\n".join(
              f"{i}. {Path(name).stem.replace('_', ' ').title()}"
              for i, name in enumerate(programs, 1)
          )

          before, rest = text.split(start, 1)
          _, after = rest.split(end, 1)

          new_text = (
              before
              + start
              + "\n"
              + program_list
              + "\n"
              + end
              + after
          )

          readme.write_text(new_text, encoding="utf-8")
          PY

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Automatically update README program list"
          git push
